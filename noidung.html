<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NỘI DUNG – Cây Nghề Nghiệp</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-main: #f8fafc;
            --root-color: #3b82f6; 
            --border: #334155;
            --navbar-height: 64px;
            --primary: #2563eb;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #ffffff;
            color: var(--text-main);
            min-height: 100vh;
            overflow: hidden;
        }
        .navbar {
            position: fixed; top: 0; left: 0; right: 0; height: var(--navbar-height);
            background: #ffffff; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; z-index: 1000;
        }
        .navbar-brand { text-decoration: none; color: #1e40af; font-size: 1.2rem; font-weight: 800; }
        .navbar-links { display: flex; gap: 8px; }
        .nav-link { padding: 10px 18px; border-radius: 8px; text-decoration: none; color: #1e293b; font-weight: 600; }
        .nav-link.active { background: var(--primary); color: #ffffff; }

        .scene-container {
            position: relative; width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            padding-top: var(--navbar-height);
        }
        
        .tree-wrapper {
            position: relative; width: 800px; height: 600px; 
        }
        .tree-image {
            width: 100%; height: 100%;
            object-fit: contain; 
        }
        .root-btn {
            position: absolute; background: var(--root-color); color: #fff;
            padding: 6px 12px; border-radius: 30px; font-weight: 700; font-size: 1.1rem;
            cursor: pointer; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            transition: all 0.3s ease; border: 2px solid #93c5fd; white-space: nowrap; z-index: 10;
            text-decoration: none; display: inline-block;
        }
        .root-btn:hover { background: #2563eb; transform: scale(1.1); }
        .root-1 { top: 78%; left: 23%; } 
        .root-2 { top: 88%; left: 30%; }  
        .root-3 { top: 88%; right: 30%; } 
        .root-4 { top: 78%; right: 25%; }
        /* hieu ung*/
        .tree-wrapper { view-transition-name: tree; }
        .root-1 { view-transition-name: tag-sothich; }
        .root-2 { view-transition-name: tag-khanang; }
        .root-3 { view-transition-name: tag-catinh; }
        .root-4 { view-transition-name: tag-giatri; }
        .fruit-pacman {
            position: absolute;
            /* Tọa độ đặt quả - Bạn có thể chỉnh số % để dời quả đi chỗ khác */
            top: 30%; 
            left: 70%; 
            
            /* Tạo hình tròn */
            width: 60px;
            height: 60px;
            background-color: #f97316; /* Màu cam giống quả */
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.3), 0 5px 15px rgba(249, 115, 22, 0.5);
            
            /* Căn giữa chữ */
            display: flex;
            justify-content: center;
            align-items: center;
            
            /* Định dạng chữ */
            color: #fff;
            font-weight: 800;
            font-size: 0.6rem;
            text-decoration: none;
            text-transform: uppercase;
            
            z-index: 10;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Hiệu ứng khi rê chuột vào quả */
        .fruit-pacman:hover {
            transform: scale(1.2) rotate(10deg);
            background-color: #ea580c; /* Màu cam đậm hơn */
        }
        .fruit-link {
            position: absolute;
            width: 50px;
            height: 50px;
            background-color: #f97316; /* Màu cam */
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.3), 0 5px 15px rgba(249, 115, 22, 0.6);
            z-index: 10;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            text-decoration: none;
        }

        /* Cuống lá xanh cho quả */
        .fruit-link::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%) rotate(-20deg);
            width: 16px;
            height: 10px;
            background-color: #22c55e;
            border-radius: 50% 50% 50% 0;
            z-index: -1;
        }

        .fruit-link:hover {
            transform: scale(1.2) rotate(10deg);
            background-color: #ea580c;
        }

        /* Tọa độ 5 quả trên cây */
        .fruit-1 { top: 15%; left: 35%; }
        .fruit-2 { top: 22%; left: 65%; }
        .fruit-3 { top: 38%; left: 20%; }
        .fruit-4 { top: 30%; left: 50%; }
        .fruit-5 { top: 13%; left: 50%; }
        .fruit-6 { top: 23%; left: 23%; }
        /* Thu nhỏ quả trên điện thoại (Dán vào trong @media (max-width: 900px)) */
        @media (max-width: 900px) {
            .fruit-link {
                width: 35px;
                height: 35px;
                font-size: 0.9rem;
            }
            .fruit-1 { top: 15%; left: 35%; }
            .fruit-2 { top: 22%; left: 65%; }
            .fruit-3 { top: 38%; left: 20%; }
            .fruit-4 { top: 30%; left: 50%; }
            .fruit-5 { top: 13%; left: 50%; }
            .fruit-6 { top: 23%; left: 23%; }
        }
        @view-transition {
            navigation: auto;
        }
        ::view-transition-group(*) {
            animation-duration: 0.5s;
        }
        /*dien thoai*/
        @media (max-width: 900px) {
            .tree-wrapper { 
                width: 100%; 
                max-width: 100%; 
                height: 55vh; 
                margin-top: 20px;
                position: relative;
            }
            .tree-image {
                object-fit: contain; 
            }
            
            /* Thu nhỏ nút */
            .root-btn { 
                padding: 5px 10px; 
                font-size: 0.75rem; 
                white-space: nowrap;
            }
            .root-1, .root-2, .root-3, .root-4 {
                transform: none; 
            }

            .root-1 { top: 78%; left: 25%; }  
            .root-2 { top: 90%; left: 30%; }  
            .root-3 { top: 90%; right: 30%; } 
            .root-4 { top: 78%; right: 25%; } 
            .fruit-pacman {
                width: 40px;
                height: 40px;
                font-size: 0.4rem;
                top: 35%; 
                left: 75%; 
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="navbar-brand">CÂY NGHỀ NGHIỆP</a>
    </nav>

    <div class="scene-container">
        <div class="tree-wrapper">
            <img src="cay.png" alt="Cây Nghề Nghiệp" class="tree-image">

            <a href="thanhqua-thunhap.html" class="fruit-link fruit-1">1</a>
            <a href="thanhqua-ondinh.html" class="fruit-link fruit-2">2</a>
            <a href="thanhqua-moitruong.html" class="fruit-link fruit-3">3</a>
            <a href="thanhqua-tontrong.html" class="fruit-link fruit-4">4</a>
            <a href="thanhqua-cohoi.html" class="fruit-link fruit-5">5</a>

            <a href="pacmans.html" class="fruit-pacman">Pac-Man</a>
            <a href="ransanmoi.html" class="fruit-link fruit-6">rắn</a>
            <a href="phamchat-sothich.html" class="root-btn root-1">Sở thích</a>
            <a href="phamchat-khanang.html" class="root-btn root-2">Khả năng</a>
            <a href="phamchat-catinh.html" class="root-btn root-3">Cá tính</a>
            <a href="phamchat-giatri.html" class="root-btn root-4">Giá trị</a>
        </div>
    </div>
</body>
</html>
