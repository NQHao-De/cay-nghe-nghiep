<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cây nghề nghiệp – Ngành Công nghệ thông tin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: url(vutru.jpg) no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .menu {
            text-align: center;
            max-width: 800px; /* Tăng nhẹ để chứa 2 nút */
            width: 100%;
        }
        
        h1 {
            font-size: 4rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 12px;
            letter-spacing: -1.5px;
            line-height: 1.1;
        }

        .subtitle {
            color: #ffffff;
            font-size: 1.3rem;
            margin-bottom: 50px;
            font-weight: 500;
        }
        
        .buttons {
            display: flex;
            gap: 24px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 250px;
            max-width: 350px;
            padding: 32px 24px;
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            text-decoration: none;
            color: #1e293b;
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .btn:hover {
            border-color: #2563eb;
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(37, 99, 235, 0.25);
        }

        .btn .label {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e40af;
        }

        .btn .desc {
            font-size: 0.9rem;
            color: #64748b;
            font-weight: 400;
        }

        /* CSS riêng cho nút thành viên để tạo điểm nhấn */
        .btn-member {
            border-color: #93c5fd;
            background: #eff6ff;
        }
        .btn-member .label {
            color: #2563eb;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.6rem; }
            .subtitle { font-size: 1.1rem; margin-bottom: 35px; }
            .buttons { flex-direction: column; align-items: center; }
            .btn { width: 100%; max-width: 100%; padding: 26px 20px; }
        }
    </style>
</head>
<body>
    <div class="menu">
        <h1>CÂY NGHỀ NGHIỆP</h1>
        <p class="subtitle">Ngành Công nghệ thông tin</p>

        <div class="buttons">
            <!-- Nút Bắt Đầu (dẫn vào nội dung chính) -->
            <a href="noidung.html" class="btn">
                <span class="label">Bắt Đầu</span>
                <span class="desc">Khám phá Phẩm Chất & Thành Quả</span>
            </a>

            <!-- Nút Thành Viên (dẫn tới trang hồ sơ) -->
            <a href="thanhvien.html" class="btn btn-member">
                <span class="label">Thành Viên</span>
                <span class="desc">Hồ sơ cá nhân của chúng tôi</span>
            </a>
        </div>
    </div>
</body>
</html>
